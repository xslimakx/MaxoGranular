[package]
name = "maxogranular"
description = "MaxoGranular - granular synthesizer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
zune-jpeg = "0.4"
zune-png = "0.4"
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
nih_plug_egui = { path = "../../vendor/nih_plug_egui" }
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
hound = "3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "aiff", "vorbis", "ogg", "wav", "pcm", "aac", "isomp4", "adpcm"] }
realfft = "3"

[features]
standalone = ["nih_plug/standalone"]

[[bin]]
name = "maxogranular"
path = "src/main.rs"
required-features = ["standalone"]

# the file dialog: native on Windows / macOS (Linux asks zenity / kdialog, see editor)
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false }
